<body>
<div id="app">
  <header id="hud">
    <div class="gold-box"><span class="coin"></span><span id="gold">0</span><span id="gps"></span></div>
    <div class="wave-box">
      <div class="wave-top"><span id="wave-label">Wave 1</span><span id="wave-count"></span></div>
      <div class="bar"><i id="wave-fill"></i></div>
    </div>
    <button id="btn-pause" class="icon-btn" aria-label="Pause and settings">⏸</button>
  </header>
  <main id="stage">
    <div id="arena">
      <div id="game"></div>
      <div id="frenzy"></div>
      <div id="bossbar"><div class="name">Slime King</div><div class="bar"><i id="boss-fill"></i></div></div>
      <div id="banner"></div>
      <div id="loading">Entering the dungeon…</div>
    </div>
  </main>
  <nav id="shop" aria-label="Upgrades"></nav>
</div>
<div id="pause-modal" class="modal" role="dialog" aria-modal="true">
  <div class="card">
    <h2>Paused</h2>
    <div class="stats" id="pause-stats"></div>
    <button class="btn primary" id="btn-resume">Resume</button>
    <button class="btn" id="btn-sound">Sound: On</button>
    <button class="btn" id="btn-debug" hidden>Debug panel</button>
    <button class="btn danger" id="btn-reset">Reset progress</button>
  </div>
</div>
