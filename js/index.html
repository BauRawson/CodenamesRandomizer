<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código Secreto</title>

  <!-- Blank-screen diagnostics. Pure ES5, runs BEFORE the app bundle so it
       still shows the error even if the bundle itself fails to parse on an old
       engine. Prints any uncaught error onto the page instead of going blank. -->
  <script>
  (function () {
    function show(msg) {
      try {
        var app = document.getElementById('app');
        if (app) app.innerHTML =
          '<pre style="color:#fff;white-space:pre-wrap;padding:24px;font-size:18px;font-weight:400">'
          + String(msg).replace(/[<&]/g, ' ') + '</pre>';
      } catch (e) {}
    }
    window.onerror = function (message, source, lineno, colno, error) {
      show(message + ' @ ' + (source || '') + ':' + (lineno || '')
        + '\n' + ((error && error.stack) || ''));
    };
    window.addEventListener('unhandledrejection', function (ev) {
      var r = ev && ev.reason;
      show('unhandledrejection: ' + ((r && r.stack) || r));
    });
  })();
  </script>
  <link rel="icon" href="/icon.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      font-weight: 900;
    }
    button {
      margin-top: 32px;
      padding: 20px 48px;
      font-size: 1.4rem;
      font-weight: 900;
      border: none;
      border-radius: 12px;
      background: rgba(255,255,255,0.25);
      color: white;
      cursor: pointer;
    }
    h1 { font-size: 3rem; color: white; }
    p  { color: rgba(255,255,255,0.7); margin-top: 12px; font-size: 1rem; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
