<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Michicho</title>
  <script>
    // GitHub Pages SPA redirect: encode path into query string, index.html decodes it
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 1).join('/') +
      '/?p=' + encodeURIComponent(l.pathname + l.search) +
      (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
    );
  </script>
</head>
<body></body>
</html>
